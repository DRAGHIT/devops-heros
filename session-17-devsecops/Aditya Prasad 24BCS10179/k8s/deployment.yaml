apiVersion: apps/v1
kind: Deployment
metadata: {name: session17-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: session17-app}
  template:
    metadata:
      labels: {app: session17-app}
    spec:
      containers:
      - name: app
        image: aditya-session17:verified
        imagePullPolicy: Never
        ports: [{containerPort: 5001}]
        readinessProbe:
          httpGet: {path: /health, port: 5001}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 128Mi}
